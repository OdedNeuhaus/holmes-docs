apiVersion: v1
kind: Service
metadata:
  name: {{ include "holmesgpt-docs.fullname" . }}
  labels:
    {{- include "holmesgpt-docs.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "holmesgpt-docs.selectorLabels" . | nindent 4 }}
