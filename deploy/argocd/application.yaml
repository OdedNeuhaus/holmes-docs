# ArgoCD Application for the docs site.
# Apply once:  kubectl apply -n argocd -f deploy/argocd/application.yaml
# From then on, every change on main (including the CI tag bump) deploys automatically.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: holmesgpt-docs
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://gitlab.example.internal/your-group/holmesgpt-docs.git
    targetRevision: main
    path: deploy/helm/holmesgpt-docs
    helm:
      releaseName: holmesgpt-docs
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: holmesgpt-docs
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
